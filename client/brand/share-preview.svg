  </g>
  <text x="600" y="329" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="76" letter-spacing="-2" fill="#4c385b">Emotale</text>
  <text x="600" y="382" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="27" fill="#705a79">Little messages. Lasting feelings.</text>
  <path d="M520 420h160" stroke="#c9afd0"/>
  <text x="600" y="479" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#584361">Someone made something for you.</text>
  <text x="600" y="520" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="21" fill="#705a79">A thoughtful little card is waiting.</text>
