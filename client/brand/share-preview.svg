  <defs>
    <linearGradient id="paper" x2="1" y2="1">
      <stop stop-color="#fffaf5"/>
      <stop offset=".55" stop-color="#fbf0f4"/>
      <stop offset="1" stop-color="#efe7f7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#paper)"/>
  <circle cx="1130" cy="30" r="230" fill="#e9dff3" opacity=".65"/>
  <circle cx="30" cy="625" r="245" fill="#f2dce5" opacity=".55"/>
  <rect x="30" y="30" width="1140" height="570" rx="28" fill="none" stroke="#d8c8df"/>
  <g transform="translate(485 92)">
    <rect width="230" height="145" rx="17" fill="#decbe9" stroke="#baa0cc" stroke-width="2"/>
    <path d="m5 9 110 74L225 9" fill="#f6edf9" stroke="#baa0cc" stroke-width="2" stroke-linejoin="round"/>
    <path d="m6 136 74-61m144 61-74-61" fill="none" stroke="#baa0cc" stroke-width="2"/>
